<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guideline checker</title>
<script>
// Set before the stylesheet paints, so a saved override never flashes the
// wrong theme for a frame -- see the toggle logic at the bottom of the page.
(function () {
  try {
    var saved = localStorage.getItem("gf_theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (err) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Palette built in oklch, not picked by eye: the three verdict colours share
     one lightness and one chroma and differ only in hue, so they read as one
     family. Dark is computed separately, never an inversion -- the semantic
     colours move UP in lightness while their tints move DOWN. Every pairing
     clears 4.5:1; body text clears 13:1. */
  :root {
    color-scheme: light dark;
    --bg: #f8f5f1;
    --panel: #fffdf9;
    --sunken: #f2f0ec;
    --border: #dfdcd7;
    --border-s: #d0cbc5;
    --text: #27221b;
    --muted: #756f67;
    --faint: #96918b;
    --accent: #25559b;
    --accent-hover: #134488;
    --btn-text: #ffffff;
    --must: #963a34;      --must-bg: #ffe9e5;  --must-line: #f7c7c1;
    --may: #864d00;       --may-bg: #feedd9;   --may-line: #ebcfad;
    --certified: #006f36; --certified-bg: #e1f7e6; --certified-line: #badfc3;
    --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191713;
      --panel: #23201d;
      --sunken: #13110d;
      --border: #37332f;
      --border-s: #4d4842;
      --text: #f1ece5;
      --muted: #a7a29c;
      --faint: #7f7b77;
      --accent: #76acf1;
      --accent-hover: #92c9ff;
      --btn-text: #0f1216;
      --must: #ff9f94;      --must-bg: #42231f;  --must-line: #683b36;
      --may: #edb163;       --may-bg: #3b280f;   --may-line: #5f431e;
      --certified: #80d498; --certified-bg: #193320; --certified-line: #2c5337;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #191713;
    --panel: #23201d;
    --sunken: #13110d;
    --border: #37332f;
    --border-s: #4d4842;
    --text: #f1ece5;
    --muted: #a7a29c;
    --faint: #7f7b77;
    --accent: #76acf1;
    --accent-hover: #92c9ff;
    --btn-text: #0f1216;
    --must: #ff9f94;      --must-bg: #42231f;  --must-line: #683b36;
    --may: #edb163;       --may-bg: #3b280f;   --may-line: #5f431e;
    --certified: #80d498; --certified-bg: #193320; --certified-line: #2c5337;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* One shared shape for every small tracked uppercase label: section
     headings, field labels, table headers. Keeps them from drifting apart. */
  .eyebrow, label, th, .card summary {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  header {
    max-width: 1040px;
    margin: 0 auto;
    padding: 38px 40px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }
  header h1 {
    margin: 8px 0 7px;
    font-size: 27px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .meta {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
  }
  .meta .sep { color: var(--border-s); }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 26px 40px 48px;
    display: grid;
    grid-template-columns: 0.86fr 1.14fr;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px 26px;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .full-width { grid-column: 1 / -1; }

  label { display: block; margin: 18px 0 7px; color: var(--muted); }
  label:first-of-type { margin-top: 0; }
  textarea, select {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    padding: 11px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--sunken);
    color: var(--text);
  }
  textarea { min-height: 96px; resize: vertical; }
  select {
    font-family: var(--sans);
    font-size: 14px;
    background: var(--panel);
    padding: 11px 14px;
  }
  textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--btn-text);
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }

  .card {
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 20px 22px;
    margin-bottom: 13px;
    background: var(--panel);
  }
  .verdict-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 13px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 5px 13px 5px 10px;
    border: 1px solid;
  }
  .badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: currentColor;
    flex-shrink: 0;
  }
  .badge.must { color: var(--must); background: var(--must-bg); border-color: var(--must-line); }
  .badge.may { color: var(--may); background: var(--may-bg); border-color: var(--may-line); }
  .badge.certified { color: var(--certified); background: var(--certified-bg); border-color: var(--certified-line); }

  .hole-badge {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--may);
    background: var(--may-bg);
    border: 1px solid var(--may-line);
    border-radius: 4px;
    padding: 3px 8px;
  }

  .card h3 {
    margin: 0 0 11px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.3;
  }
  /* The source sentence gets its own surface: provenance is a claim this
     system makes, so it should not read as a caption. */
  .card .source {
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    background: var(--sunken);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 13px;
    font-style: normal;
  }
  .card .explanation { margin: 0; font-size: 14.5px; line-height: 1.62; }

  /* The counterexample is the argument, not a trailing sentence. */
  .turns-on {
    background: var(--may-bg);
    border: 1px solid var(--may-line);
    border-radius: 8px;
    padding: 13px 15px;
    margin-top: 15px;
  }
  .turns-on .eyebrow { color: var(--may); margin-bottom: 8px; }
  .turns-on .clause {
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--may);
  }

  .card details { margin-top: 14px; }
  .card summary { cursor: pointer; }
  .card summary:hover { color: var(--muted); }
  .card pre {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    background: var(--sunken);
    padding: 12px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    margin: 10px 0 0;
  }

  .error {
    color: var(--must);
    background: var(--must-bg);
    border: 1px solid var(--must-line);
    border-radius: 8px;
    padding: 12px 15px;
    font-size: 14px;
  }
  .loading { color: var(--muted); font-size: 14px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 0 4px 10px;
    border-bottom: 1px solid var(--border-s);
  }
  td {
    text-align: left;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  code {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
  }

  .back-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
  .back-link:hover { text-decoration: underline; }

  .residue-note {
    max-width: 1040px;
    margin: 22px auto 0;
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--may);
    background: var(--may-bg);
    border: 1px solid var(--may-line);
    border-radius: 9px;
    padding: 12px 15px;
  }
  .residue-wrap { padding: 0 40px; }
  .residue-note strong { font-weight: 600; }
  .residue-note a { color: inherit; }
  .residue-note svg { flex-shrink: 0; }

  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    padding: 0;
    margin: 0;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--panel); }
  .theme-toggle svg { display: block; }
  .theme-toggle circle.ring { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .theme-toggle circle.dot { fill: currentColor; }
</style>
</head>
<body>

<header>
  <div>
    <a class="back-link" id="back-link" href="/">&larr; Dashboard</a>
    <h1 id="guideline-title">Guideline compliance checker</h1>
    <p class="meta" id="guideline-meta">Loading&hellip;</p>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button"
          aria-label="Toggle colour theme" title="Toggle colour theme">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <circle class="ring" cx="9" cy="9" r="7"></circle>
      <circle class="dot" id="theme-dot" cx="9" cy="9" r="3"></circle>
    </svg>
  </button>
</header>
<div class="residue-wrap"><div id="residue-note"></div></div>

<main>
  <section class="panel">
    <h2>Check a case</h2>
    <label for="patient">Patient &middot; lab values</label>
    <textarea id="patient" spellcheck="false"></textarea>

    <label for="plan">Plan &middot; drug and action flags</label>
    <textarea id="plan" spellcheck="false"></textarea>

    <button id="check-btn">Check compliance</button>
  </section>

  <section class="panel">
    <h2>Result</h2>
    <div id="results"><p class="loading">Paste a case, then hit Check.</p></div>
  </section>

  <section class="panel full-width">
    <h2>Available rules &amp; variables</h2>
    <div id="rules-table"><p class="loading">Loading&hellip;</p></div>
  </section>
</main>

<script>
const GUIDELINE_ID = new URLSearchParams(window.location.search).get("guideline") || "fixtures";

// Arriving from the demo should go back to the demo, not to the library the
// visitor never came from. The demo's links carry ?from=demo for exactly this.
if (new URLSearchParams(window.location.search).get("from") === "demo") {
  const back = document.getElementById("back-link");
  back.href = "/demo";
  back.innerHTML = "&larr; Demo";
}
const patientEl = document.getElementById("patient");
const planEl = document.getElementById("plan");
const resultsEl = document.getElementById("results");

async function loadGuidelineHeader() {
  const titleEl = document.getElementById("guideline-title");
  const metaEl = document.getElementById("guideline-meta");
  const residueEl = document.getElementById("residue-note");
  try {
    const response = await fetch(`/guidelines/${encodeURIComponent(GUIDELINE_ID)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "not found");
    titleEl.textContent = data.title;
    const bits = [`${data.rule_count} rule${data.rule_count === 1 ? "" : "s"}`];
    if (data.refusal_count) bits.push(`${data.refusal_count} refused`);
    if (data.needs_model_count) bits.push(`${data.needs_model_count} awaiting formalization`);
    metaEl.innerHTML = bits.map((b) => `<span>${b}</span>`).join('<span class="sep">/</span>');
    if (data.refusal_count) {
      // Points at the rendered report, not /residue -- that route is the JSON
      // an API client wants, and sending a person there hands them a wall of
      // it. The report already lays out every refusal with its reason.
      residueEl.innerHTML = `<div class="residue-note">` +
        `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">` +
        `<circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"></circle>` +
        `<path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>` +
        `<circle cx="8" cy="11.3" r="0.85" fill="currentColor"></circle></svg>` +
        `<span><strong>${data.refusal_count} statement(s) could not be encoded.</strong> ` +
        `<a href="/guidelines/${encodeURIComponent(GUIDELINE_ID)}/report" target="_blank">See formalization report</a>` +
        `.</span></div>`;
    }
  } catch (err) {
    titleEl.textContent = "Unknown guideline";
    metaEl.textContent = err.message;
  }
}

function humanize(name) {
  return String(name).replace(/_/g, " ");
}

function humanizeValue(v) {
  if (typeof v === "boolean") return v ? "true" : "false";
  return String(v);
}

// The core is the argument of the whole system, so it gets its own block
// rather than being appended to the explanation sentence. Returns the raw
// clauses; renderResult decides how to present them.
function counterexampleClauses(result) {
  return Object.entries(result.counterexample_core || {})
    .map(([k, v]) => `${humanize(k)} = ${humanizeValue(v)}`);
}

function verdictBadgeClass(verdict) {
  if (verdict === "MUST-violate") return "must";
  if (verdict === "OPTION-taken") return "certified";
  if (verdict && verdict.startsWith("OPTION-")) return "may";
  if (verdict === "CERTIFIED-compliant") return "certified";
  return "may";
}

function renderResult(result) {
  const badgeClass = verdictBadgeClass(result.verdict);
  let explanation;
  if (result.verdict === "MUST-violate") {
    explanation = "This plan definitely violates the rule, given what's specified.";
  } else if (result.verdict === "OPTION-not-taken") {
    explanation = "The guideline OFFERS this action, it does not require it. The " +
      "conditions are met and the action is absent -- that is not a violation, " +
      "the option simply was not taken.";
  } else if (result.verdict === "OPTION-taken") {
    explanation = "The guideline offers this action and it was taken.";
  } else if (result.verdict === "OPTION-not-applicable") {
    explanation = "This option does not apply to this patient -- the conditions " +
      "under which the guideline offers it are not met.";
  } else if (result.verdict === "OPTION-available") {
    explanation = "The guideline offers this action. Whether it applies to this " +
      "patient is not yet determined from what's specified. Nothing here can be " +
      "a violation: the action is permitted, not required.";
  } else if (result.verdict === "CERTIFIED-compliant") {
    explanation = "This plan is certified compliant with the rule -- no completion of the unspecified values could violate it.";
  } else {
    explanation = "Compliance isn't determined yet from what's specified.";
  }
  const known = Object.entries(result.known_variables || {})
    .map(([k, v]) => `${humanize(k)}=${humanizeValue(v)}`)
    .join(", ") || "(none)";
  const holeBadge = result.partial
    ? `<span class="hole-badge">${result.open_holes.map(humanize).join(", ")} &mdash; left undefined</span>`
    : "";

  // Only an undetermined verdict has something it turns on; a definite one
  // has nothing left to name.
  const clauses = counterexampleClauses(result);
  const turnsOn = clauses.length
    ? `<div class="turns-on">
         <div class="eyebrow">What it turns on</div>
         <div class="clause">${clauses.join(" and ")}</div>
       </div>`
    : "";

  return `
    <div class="card">
      <div class="verdict-row">
        <span class="badge ${badgeClass}">${result.verdict}</span>${holeBadge}
      </div>
      <h3>${result.title}</h3>
      <p class="source">&ldquo;${result.source_sentence}&rdquo;</p>
      <p class="explanation">${explanation}</p>
      ${turnsOn}
      <details>
        <summary>known values: ${known}</summary>
        <pre>${JSON.stringify(result, null, 2)}</pre>
      </details>
    </div>
  `;
}

async function runCheck() {
  let patient, plan;
  try {
    patient = patientEl.value.trim() ? JSON.parse(patientEl.value) : {};
    plan = planEl.value.trim() ? JSON.parse(planEl.value) : {};
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">Invalid JSON: ${err.message}</div>`;
    return;
  }

  resultsEl.innerHTML = '<p class="loading">Checking&hellip;</p>';
  try {
    const response = await fetch(`/guidelines/${encodeURIComponent(GUIDELINE_ID)}/check`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patient, plan }),
    });
    const data = await response.json();
    if (!response.ok) {
      resultsEl.innerHTML = `<div class="error">${data.error}</div>`;
      return;
    }
    resultsEl.innerHTML = data.map(renderResult).join("");
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">Request failed: ${err.message}</div>`;
  }
}

async function loadRulesTable() {
  const el = document.getElementById("rules-table");
  try {
    const response = await fetch(`/guidelines/${encodeURIComponent(GUIDELINE_ID)}/rules`);
    const rules = await response.json();
    const rows = rules
      .map(
        (r) => `
        <tr>
          <td><code>${r.rule_id}</code></td>
          <td>${r.title}</td>
          <td>${r.category}</td>
          <td>${r.variables.map((v) => `<code>${v}</code>`).join(" ")}</td>
        </tr>`
      )
      .join("");
    el.innerHTML = `
      <table>
        <thead><tr><th>Rule</th><th>Title</th><th>Category</th><th>Variables</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (err) {
    el.innerHTML = `<div class="error">Could not load the rule list: ${err.message}</div>`;
  }
}

const THEME_KEY = "gf_theme";

function currentTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (err) {}
  if (saved === "light" || saved === "dark") return saved;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function refreshThemeToggle() {
  // Same ring either way; the centre dot fills out in dark mode, so the icon
  // shows the current state rather than naming the one you'd switch to.
  const dark = currentTheme() === "dark";
  document.getElementById("theme-dot").setAttribute("r", dark ? "4.5" : "2.5");
  document.getElementById("theme-toggle").title =
    dark ? "Switch to light mode" : "Switch to dark mode";
}

document.getElementById("theme-toggle").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
  refreshThemeToggle();
});
refreshThemeToggle();

document.getElementById("check-btn").addEventListener("click", runCheck);

// Sequential, not fire-and-forget: three concurrent requests on page load
// can drop or corrupt connections on Flask's single-threaded dev server.
(async () => {
  patientEl.value = "{}";
  planEl.value = "{}";
  await loadGuidelineHeader();
  await loadRulesTable();
})();
</script>

</body>
</html>
