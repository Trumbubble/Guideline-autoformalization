<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="336" viewBox="0 0 1400 336" role="img" aria-label="One formula under two deontic operators. Under an obligation the violation condition is when and not then, so a patient meeting the antecedent without the consequent is a real deviation. Under a permission the violation condition is the constant false, so no patient and no completion of the unknowns can ever yield a violation.">
        <defs><marker id="d3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<style><![CDATA[
.card{fill:#FFFFFF; stroke:#6E7975; stroke-width:1}
.card-2{fill:#E6EAE5; stroke:#C2CAC5; stroke-width:1}
.node{fill:#FFFFFF; stroke:#6E7975; stroke-width:1.2}
.node-op{fill:#DDEBE7; stroke:#0B5F55; stroke-width:1.6}
.hole{fill:#F0DFD8; stroke:#8E3D22; stroke-width:1.2}
.f0{fill:#E6EAE5; stroke:#6E7975; stroke-width:1}
.f1{fill:#B7D6CE; stroke:#0B5F55; stroke-width:1}
.f2{fill:#0B5F55; stroke:#0B5F55; stroke-width:1}
.t-band{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-weight:700; font-size:11px;
  fill:#0B5F55; letter-spacing:.12em}
.t-bandn{font-family:Archivo, Helvetica, Arial, sans-serif; font-weight:700; font-size:13px; fill:#111614}
.t-cap{font-family:Archivo, Helvetica, Arial, sans-serif; font-weight:650; font-size:11.5px; fill:#111614}
.t-code{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-size:10px; fill:#4A5450}
.t-code-k{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-weight:700; font-size:10px; fill:#111614}
.t-big{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-weight:700; font-size:15px; fill:#111614}
.t-note{font-family:Archivo, Helvetica, Arial, sans-serif; font-size:10.5px; font-style:italic; fill:#7C8783}
.t-edge{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-size:9.5px; fill:#4A5450}
.t-frag{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-weight:700; font-size:8.5px; fill:#111614}
.t-frag-i{font-family:JetBrains Mono, DejaVu Sans Mono, monospace; font-weight:700; font-size:8.5px; fill:#FFFFFF}
.edge{stroke:#6E7975; stroke-width:1.3; fill:none}
.edge-a{stroke:#0B5F55; stroke-width:1.6; fill:none}
.div{stroke:#C2CAC5; stroke-width:1}
.mk{fill:#6E7975}
.mk-a{fill:#0B5F55}
]]></style>

        <rect class="node-op" x="550" y="16" width="300" height="40" rx="4"/>
        <text class="t-big" x="700" y="42" text-anchor="middle">φ  =  ( when → then )</text>
        <text class="t-note" x="700" y="72" text-anchor="middle">rule_to_z3 gives this in both columns — it describes the CONTENT, so degeneracy checking applies to a permission too</text>

        <path class="edge" marker-end="url(#d3)" d="M640 56 V84 H350 V106"/>
        <path class="edge" marker-end="url(#d3)" d="M760 56 V84 H1050 V106"/>

        <rect class="card" x="40" y="108" width="620" height="150" rx="5"/>
        <text class="t-cap" x="56" y="130">obligation — O(then | when)</text>
        <text class="t-code-k" x="56" y="156">violation_condition  =  when ∧ ¬then</text>
        <text class="t-note" x="56" y="182">“We recommend anticoagulant prophylaxis.”</text>
        <text class="t-note" x="56" y="200">A patient who meets when without then is a real deviation, and</text>
        <text class="t-note" x="56" y="214">the three-valued verdict applies in full.</text>
        <text class="t-note" x="56" y="238">GRADE-conditional stays here: “we suggest X” is weak EVIDENCE,</text>
        <text class="t-note" x="56" y="252">not an optional action.</text>

        <rect class="card" x="740" y="108" width="620" height="150" rx="5"/>
        <text class="t-cap" x="756" y="130">permission — P(then | when)</text>
        <text class="t-code-k" x="756" y="156">violation_condition  =  FALSE, unconditionally</text>
        <text class="t-note" x="756" y="182">“Epidural analgesia may be considered.”</text>
        <text class="t-note" x="756" y="200">There is no patient, and no completion of the unknowns, for which</text>
        <text class="t-note" x="756" y="214">this yields MUST-violate. The verdicts are OPTION-taken,</text>
        <text class="t-note" x="756" y="228">not-taken, available, not-applicable — none is an accusation.</text>
        <text class="t-note" x="756" y="252">Measured: 15% of real recommendations are permissive.</text>

        <path class="div" d="M40 280 H1360"/>
        <text class="t-edge" x="40" y="300">The fallback only ever moves obligation → permission, never the reverse.</text>
        <text class="t-note" x="40" y="316">Guessing permission wrongly silences an alert, which is recoverable. Guessing obligation wrongly accuses a clinician, which is not.</text>
      </svg>