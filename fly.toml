# fly.toml app configuration file generated for guidelineforge on 2026-09-05T02:21:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# RUN EXACTLY ONE MACHINE:   fly scale count 1
#
# `fly launch` provisions two by default for high availability. That breaks
# this app: uploaded guidelines are written to guidelines.STORE_DIR, a path
# on the machine's OWN filesystem, and two machines share no disk -- so an
# upload is visible only on the machine that handled it, and the in-memory
# progress record has the same problem.
#
# Machine count is set by `fly scale`, never from this file, so re-check it
# with `fly status` after any `fly launch`.
#
# Running two would need shared storage first: a volume mounted at
# /app/patient_checker/guidelines (see DEPLOY.md), or moving the store off
# the filesystem entirely.

app = 'guidelineforge'
primary_region = 'lhr'

[build]
[env]
  GF_HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
